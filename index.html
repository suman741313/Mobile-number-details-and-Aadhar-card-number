<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>সুমন বিশ্বাস - Number Lookup</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f7fb;
    color:#252525;
    font-family:Georgia, "Times New Roman", serif;
}

/* Header */
header{
    height:65px;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.logo{
    font-size:24px;
    font-style:italic;
    color:#e58a28;
}

.menu{
    font-size:30px;
}

/* Main */
.container{
    max-width:650px;
    margin:45px auto;
    padding:0 18px;
}

/* Card */
.card{
    background:#fff;
    padding:32px;
    border-radius:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
}

h1{
    margin:0 0 8px;
    font-size:35px;
    font-weight:500;
    font-style:italic;
}

.description{
    color:#777;
    font-size:18px;
    line-height:1.4;
    font-style:italic;
    margin-bottom:28px;
}

label{
    display:block;
    font-size:17px;
    margin-bottom:10px;
    font-style:italic;
}

input{
    width:100%;
    height:58px;
    border:1px solid #ddd;
    border-radius:15px;
    padding:0 20px;
    font-size:18px;
    font-family:Georgia,serif;
    outline:none;
}

input:focus{
    border-color:#e88920;
}

/* Button */
button{
    width:100%;
    height:60px;
    margin-top:20px;
    border:0;
    border-radius:15px;
    background:#ed8417;
    color:#fff;
    font-size:20px;
    font-family:Georgia,serif;
    font-style:italic;
    cursor:pointer;
    transition: opacity 0.2s;
}

button:disabled{
    opacity: 0.6;
    cursor: not-allowed;
}

button:active{
    transform:scale(.99);
}

/* Results Section */
#result-container {
    margin-top: 25px;
}

.result-card {
    background: #fff;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    border-left: 5px solid #ed8417;
}

.result-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed #eee;
    font-size: 15px;
}

.result-item:last-child {
    border-bottom: none;
}

.result-label {
    color: #888;
    font-weight: 500;
}

.result-value {
    color: #222;
    font-weight: bold;
    text-align: right;
    max-width: 65%;
    word-break: break-word;
}

.status-msg {
    text-align: center;
    padding: 15px;
    font-style: italic;
    color: #666;
}

/* Footer */
footer{
    text-align:center;
    color:#999;
    font-size:13px;
    padding:20px;
}

@media(max-width:600px){
    .container{
        margin:35px auto;
    }

    .card{
        padding:28px 20px;
    }

    h1{
        font-size:32px;
    }

    .description{
        font-size:17px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        ◯ সুমন বিশ্বাস
    </div>
    <div class="menu">
        ☰
    </div>
</header>

<div class="container">

    <div class="card">
        <h1>Number Lookup</h1>
        <div class="description">
            Enter a number and check the response directly on this page.
        </div>

        <form id="lookupForm">
            <label for="num">Mobile Number</label>
            <input
                id="num"
                name="num"
                type="tel"
                inputmode="numeric"
                placeholder="Enter mobile number"
                required
            >

            <button type="submit" id="submitBtn">
                Search Number
            </button>
        </form>
    </div>

    <div id="result-container"></div>

</div>

<footer>
    © 2026 সুমন বিশ্বাস
</footer>

<script>
document.getElementById('lookupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const num = document.getElementById('num').value.trim();
    const resultContainer = document.getElementById('result-container');
    const submitBtn = document.getElementById('submitBtn');
    
    if(!num) return;

    submitBtn.disabled = true;
    submitBtn.innerText = 'Searching...';
    resultContainer.innerHTML = '<div class="status-msg">Searching details, please wait...</div>';

    const apiKey = "suman74131_0818e3a9ae399b79";
    const targetUrl = `https://markplace.site/api.php?key=${apiKey}&type=number&num=${encodeURIComponent(num)}`;
    
    // Using a CORS proxy to bypass browser restrictions
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

    try {
        const response = await fetch(proxyUrl);
        const data = await response.json();

        resultContainer.innerHTML = '';

        if (data.status === 'success' && Array.isArray(data.result) && data.result.length > 0) {
            data.result.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div style="font-size: 16px; font-weight: bold; color: #ed8417; margin-bottom: 10px;">
                        Result #${index + 1}
                    </div>
                    <div class="result-item">
                        <span class="result-label">Name:</span>
                        <span class="result-value">${item.name || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Father's Name:</span>
                        <span class="result-value">${item.fname || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Mobile Number:</span>
                        <span class="result-value">${item.num || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Alt Mobile:</span>
                        <span class="result-value">${item.alt || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Circle / Operator:</span>
                        <span class="result-value">${item.circle || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Email:</span>
                        <span class="result-value">${item.email || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Aadhar:</span>
                        <span class="result-value">${item.aadhar || 'N/A'}</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Address:</span>
                        <span class="result-value">${(item.address || 'N/A').replace(/!/g, ' ')}</span>
                    </div>
                `;
                resultContainer.appendChild(card);
            });
        } else {
            resultContainer.innerHTML = `<div class="status-msg" style="color: #d9534f;">${data.message || 'No details found.'}</div>`;
        }
    } catch (error) {
        resultContainer.innerHTML = '<div class="status-msg" style="color: #d9534f;">Failed to fetch data. Please check your network or API status.</div>';
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Search Number';
    }
});
</script>

</body>
</html>
